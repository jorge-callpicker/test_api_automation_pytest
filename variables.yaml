# variables.yaml
#
# Variables no sensibles para resolver placeholders {{...}} en los tests.
# Los secretos y URLs de ambiente viven en .env (ver .env.example).
#
# Tres secciones hermanas:
#   globals:        variables GLB-*      → aplican a todo el proyecto
#   test_cases:     variables TC-XXX-*   → aplican a un caso AAA del .md
#   matrix_values:  variables MTZ-*      → aplican a tests de matriz CSV
#
# Placeholders `[REQUIERE RESPUESTA: ...]` deben reemplazarse con el valor
# real sembrado en el ambiente de pruebas antes de ejecutar el TC/matriz.

# =============================================================================
# GLOBALS — Variables GLB-* aplicables a todos los tests
# =============================================================================
#
# Regla de resolución:
#   {{GLB-account_id_valido}} → primero busca en .env como
#   GLB_ACCOUNT_ID_VALIDO (guion → underscore, upper); si no está, busca
#   aquí en globals.

globals:
  GLB-account_id_valido: 65
  GLB-inbox_id_valido: 100

  #GLB-url_cp_api: "https://black.digitum.com.mx/chucho/callpicker_api/api_develop"
  GLB-url_cp_api: "https://black.digitum.com.mx/paloma/callpicker_api/api_develop"

  # Valores para el Login y seleccion de cuenta
  GLB-path_login: "/panel_chat/login"
  GLB-path_select_account: "/panel_chat/selectAccount/{account_id}"

  ## Usuario SuperAdmin
  ## Definidas en .env:  USR_SADMIN, PSW_SADMIN

  ## Usuario Admin
  ## Definidas en .env:  USR_ADMIN, PSW_ADMIN

  # --- Sembradas por add-test-create-matriz-c1-sin-header (endpoint create) ---
  # (cuenta existente, ajena a la sesión)
  GLB-create-account_id_ajeno: 60
  # (cuenta inexistente)
  GLB-create-account_id_inexistente: 100
  # (arreglo con UUID inexistente o inactivo)
  GLB-create-app_id_inactivo: ['de84e961-c95e-41ad-baff-c005d422d7db']
  # (arreglo con UUID que no pertenece a la cuenta)
  GLB-create-app_id_otra_cuenta: ['26a51522-cb0b-4293-8d72-cd7d4d578d1d']
  # (arreglo con un único UUID válido de una app existente de la cuenta)
  GLB-create-app_id_valido: ['6cdd7b59-cbc7-4a47-b2c9-52eae306f136']
  # (arreglo con un UUID existente modificando o agregando un carácter del string original)
  GLB-create-app_id_valido_mutado: ['6cdd7b59-cbc7-4a47-b2c9-52eae306fxxx']  # calculado tras sembrar app_id_valido
  # (arreglo con múltiples UUID válidos de apps existentes de la cuenta)
  GLB-create-apps_ids_validos: ["6cdd7b59-cbc7-4a47-b2c9-52eae306f136", "4514e6cf-7702-4a83-b3bc-add0347ac54e"]
  # (nombre ya utilizado en una petición anterior)
  GLB-create-name_ya_utilizado: 'wa_prueba_envio'


test_cases:

  #Template
  #TC-001:
  #  description: "Eliminación exitosa sin envíos masivos asociados (Admin) - Set 1"
  #  seed: |
  #    Sembrar en la tabla `Templates Gupshup` un template con active != -1
  #    asociado a GLB-account_id_valido y GLB-inbox_id_valido, sin ningún
  #    envío masivo relacionado. Este template quedará con active = -1
  #    tras la ejecución del test — no reutilizar en otros casos.
  #  variables:
  #    TC-001-template_id_sin_envios: "[REQUIERE RESPUESTA: template_id sembrado según la descripción de seed. Ejemplo: 100123]"


