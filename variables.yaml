# variables.yaml
#
# Variables no sensibles para resolver placeholders {{...}} en los tests.
# Los secretos y URLs de ambiente viven en .env (ver .env.example).
#
# Convenciones:
#   globals.GLB-<nombre>                → aplica a todos los TC.
#   test_cases.TC-XXX.variables.<nombre> → aplica exclusivamente al TC-XXX.
#
# El framework resuelve:
#   {{GLB-account_id_valido}}          → globals.GLB-account_id_valido
#   {{TC-001-template_id_sin_envios}}  → test_cases.TC-001.variables.TC-001-template_id_sin_envios
#
# Placeholders `[REQUIERE RESPUESTA: ...]` deben reemplazarse con el valor
# real sembrado en el ambiente de pruebas antes de ejecutar el TC.
#
# Nota importante sobre datos de un solo uso:
#   Los templates sembrados para tests de eliminación quedan con
#   active = -1 tras la ejecución exitosa. No reutilizar entre corridas —
#   sembrar nuevos y actualizar aquí, o versionar la matriz de seed y
#   automatizar el re-seed (change proposal futuro).

globals:
  GLB-account_id_valido: "[REQUIERE RESPUESTA: entero entre 1 y 2147483648 correspondiente a una cuenta válida en el ambiente de pruebas. Ejemplo: 6]"
  GLB-inbox_id_valido: "[REQUIERE RESPUESTA: entero entre 1 y 2147483648 correspondiente a un inbox válido asociado a la cuenta anterior. Ejemplo: 5]"

test_cases:

  TC-001:
    description: "Eliminación exitosa sin envíos masivos asociados (Admin) - Set 1"
    seed: |
      Sembrar en la tabla `Templates Gupshup` un template con active != -1
      asociado a GLB-account_id_valido y GLB-inbox_id_valido, sin ningún
      envío masivo relacionado. Este template quedará con active = -1
      tras la ejecución del test — no reutilizar en otros casos.
    variables:
      TC-001-template_id_sin_envios: "[REQUIERE RESPUESTA: template_id sembrado según la descripción de seed. Ejemplo: 100123]"

  TC-002:
    description: "Bloqueo por combinación de envíos masivos, permitidos y uno bloqueante (RUNNING) - Set 2"
    seed: |
      Sembrar en la tabla `Templates Gupshup` un template asociado a 3
      envíos masivos con estados BROADCAST, STOPPED y RUNNING
      respectivamente. Todos apuntando al mismo template_id. Este template
      debe conservar active != -1 tras la ejecución (el 423 impide el
      borrado).
    variables:
      TC-002-template_id_mixto: "[REQUIERE RESPUESTA: template_id sembrado según la descripción de seed. Ejemplo: 100124]"

  TC-003:
    description: "Bloqueo por envío masivo en estado RUNNING - Set 2"
    seed: |
      Sembrar en la tabla `Templates Gupshup` un template asociado a
      exactamente un envío masivo con estado RUNNING. Este template debe
      conservar active != -1 tras la ejecución (el 423 impide el borrado).
    variables:
      TC-003-template_id_estado_running: "[REQUIERE RESPUESTA: template_id sembrado según la descripción de seed. Ejemplo: 100125]"
